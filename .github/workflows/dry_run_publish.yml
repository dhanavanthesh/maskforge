name: Dry-run Publish

on:
  # Manual only: the full wheel matrix competes with a real release for scarce macOS runners.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_wheels:
    uses: ./.github/workflows/build_wheels.yml

  dry_run:
    needs: build_wheels
    name: Dry-run for publishing to PyPI and crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdist
          path: dist

      - name: List downloaded artifacts
        run: ls -lh dist/

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - run: pip install -U twine

      - name: Validate Python distributions
        run: twine check --strict dist/*

      # No --allow-dirty: a dry run that bypasses the checks proves nothing.
      - name: Dry-run publish to crates.io
        run: |
          set -euo pipefail
          cargo package -p maskforge-core
          cargo publish -p maskforge-core --dry-run
