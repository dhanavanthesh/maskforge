# maskforge workspace root (virtual manifest). See project-details/outline-forge/maskforge-v0.
[workspace]
resolver = "3"
members = ["crates/maskforge-core", "crates/maskforge-py"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "Apache-2.0"
repository = "https://github.com/dhanavanthesh/maskforge"
homepage = "https://github.com/dhanavanthesh/maskforge"
authors = ["MaskForge contributors"]

[workspace.dependencies]
# Exact pin: the regex-automata 0.4.18 API/semantics are the ones verified by the parent probe.
regex-automata = { version = "=0.4.18", default-features = false, features = ["std", "syntax", "dfa-build", "dfa-search", "unicode-gencat"] }
rustc-hash = "2.1.0"
thiserror = "2.0"
bincode = "2.0.1"
# Merkle content-address over IR structure (32-byte digest); std only, no SIMD extras pulled in.
blake3 = { version = "1", default-features = false, features = ["std"] }
# RFC 3986 URI/reference parsing and resolution for schema-resource identity.
fluent-uri = { version = "=0.4.1", default-features = false, features = ["alloc"] }
# HF path (feature-gated off by default in maskforge-core); pinned to the clone's versions.
once_cell = "1.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }
hf-hub = { version = "=0.4.1", default-features = false, features = ["ureq", "rustls-tls"] }
# Python FFI wall (maskforge-py only, behind feature="python-bindings"). abi3-py311: CPython's
# limited/stable API only gained buffer-protocol support (`Py_buffer`) at 3.11, and
# `PyMaskTableView`'s zero-copy `__getbuffer__` needs it - raised from abi3-py39 for that reason.
# No `extension-module` feature: maturin >= 1.9.4 sets PYO3_BUILD_EXTENSION_MODULE automatically.
pyo3 = { version = "0.29.2", default-features = false, features = ["abi3-py311", "macros"] }
# Release-benchmark process peak-working-set probe (release_bench bin only), Windows target only.
windows-sys = { version = "0.59", features = ["Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Foundation"] }

# Shared release profile: NO panic="abort" here (PyO3 exception translation + criterion unwind need it).
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Distribution profile: fat LTO + panic=abort, for the non-PyO3 core artifact only.
[profile.dist]
inherits = "release"
lto = "fat"
panic = "abort"
